# Uses DSH's native session controller, persistent history and goal driver.
# Recovery runs once after each restart; the plugin is dormant in steady state.
# Override defaults through settings.yaml under dsh-keep-going.
- insert:
    - id: keep-going
      name: dsh-keep-going
      config:
        drainTimeoutMs: 600000
        retryMinMs: 1000
        retryMaxMs: 60000
        maxAttempts: 3
        restartExitCode: 75
        restartBurstLimit: 5
        restartWindowMs: 60000
